name: Test

on:
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/test.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm test
