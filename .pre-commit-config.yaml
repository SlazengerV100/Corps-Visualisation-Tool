repos:
  - repo: local
    hooks:
      - id: backend-lint
        name: backend lint
        entry: npm run lint --workspace backend
        language: system
        files: ^(backend/|package(-lock)?\.json$|tsconfig\.base\.json$|\.oxlintrc\.jsonc$)
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: npm run lint --workspace frontend
        language: system
        files: ^(frontend/|package(-lock)?\.json$|tsconfig\.base\.json$|\.oxlintrc\.jsonc$)
        pass_filenames: false
